<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Google (New web)</title><meta name="title" content="Google (New web)"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    
    <!-- CSS Disepadukan -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }

        /* Navigasi Atas */
        header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
            gap: 15px;
        }

        header a {
            color: #202124;
            text-decoration: none;
            font-size: 14px;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* Bahagian Utama / Carian */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 584px;
            padding: 0 20px;
            margin-top: -100px;
        }

        .logo {
            font-size: 90px;
            font-weight: bold;
            letter-spacing: -3px;
            margin-bottom: 20px;
            user-select: none;
        }

        /* Warna Huruf Logo Google */
        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        /* Kotak Carian */
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 15px;
            box-shadow: none;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
            margin-right: 12px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #202124;
        }

        /* Butang Carian */
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .btn:hover {
            border-color: #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            color: #202124;
        }

        /* Footer */
        footer {
            width: 100%;
            background: #f2f2f2;
            color: #70757a;
            font-size: 14px;
            text-align: center;
            padding: 15px;
            border-top: 1px solid #e4e4e4;
        }
    </style>



    <!-- Header -->
    <header>
        <a href="https://mail.google.com" target="_blank">Gmail</a>
        <a href="https://www.google.com/imghp" target="_blank">Images</a>
    </header>

    <!-- Content Utama -->
    <main>
        <!-- Logo Google -->
        <div class="logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>

        <!-- Form / Kotak Carian -->
        <form id="searchForm" style="width: 100%;">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari di Google atau taip URL" autofocus="" autocomplete="off">
            </div>

            <div class="buttons">
                <button type="submit" class="btn">Google Search</button>
                <button type="button" id="luckyBtn" class="btn">I'm Feeling Lucky</button>
            </div>
        </form>
    </main>

    <!-- Footer -->
    <footer>
        Google Clone © 2026
    </footer>

    <!-- JavaScript Disepadukan (Di bahagian bawah supaya DOM sedia dimuatkan) -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const luckyBtn = document.getElementById('luckyBtn');

        // Pencarian Normal
        if (searchForm) {
            searchForm.addEventListener('submit', function(event) {
                event.preventDefault();
                
                const query = searchInput ? searchInput.value.trim() : '';
                
                if (query !== '') {
                    // Gunakan window.open dengan '_blank' agar terbuka di tab baru
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                }
            });
        }

        // Tombol Lucky
        if (luckyBtn) {
            luckyBtn.addEventListener('click', function() {
                const query = searchInput ? searchInput.value.trim() : '';
                if (query !== '') {
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}&btnI=I`, '_blank');
                } else {
                    window.open(`https://www.google.com/doodles`, '_blank');
                }
            });
        }
    });
</script>


<script src="./script.js"></script></body></html>
